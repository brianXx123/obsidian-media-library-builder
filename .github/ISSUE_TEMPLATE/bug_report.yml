name: "Bug report / 缺陷反馈"
description: "Report a reproducible bug without disclosing private vault data / 提交可复现问题，请勿泄露私人资料"
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please **remove private paths, titles, API keys and watch history** from logs/screenshots before submitting.
        请删除日志或截图中的私人目录、影视记录、密钥与观看历史。
  - type: input
    id: version
    attributes:
      label: "Project and plugin version / 项目及插件版本"
      placeholder: "0.3.1"
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: "Affected component / 受影响模块"
      options:
        - AI Skill / AI 技能
        - Python importer / 导入器
        - Obsidian Movie Wall / 海报墙
        - Installer or upgrades / 安装升级
        - Demo, docs or packaging / 演示文档与打包
        - Other / 其他
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: "Environment / 系统及 Obsidian 版本"
      placeholder: "Windows 11; Obsidian Desktop 1.14.5; Python 3.13"
  - type: textarea
    id: steps
    attributes:
      label: "Steps to reproduce / 复现步骤"
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Expected / 预期结果"
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: "Actual behavior / 实际结果"
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: "Sanitized logs / screenshots / 脱敏证据"
      description: "Use fictional titles where possible. / 尽量使用虚构作品"
  - type: checkboxes
    id: privacy
    attributes:
      label: "Privacy check / 隐私检查"
      options:
        - label: "I have removed private data and secrets. / 我已清理私人数据和密钥"
          required: true
