name: Verified screenshot previews / 已验证截图预览

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/showcase.yml
      - scripts/make_showcase.py
      - docs/screenshots/*.png
      - docs/screenshots/metadata.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: showcase-preview-main
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact public screenshot sources
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install preview-only image dependency
        run: python -m pip install pillow==11.3.0
      - name: Verify original screenshot integrity and create derivatives
        run: python scripts/make_showcase.py
      - name: Commit only derived previews (never original screenshots)
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/previews/
          if git diff --cached --quiet; then
            echo "Previews already up to date"
          else
            git commit -m "docs: add compressed verified screenshot previews [skip ci]"
            git push origin HEAD:main
          fi
