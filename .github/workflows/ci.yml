name: Tests / 自动化测试
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Node syntax check
        run: node --check plugin/main.js
      - name: Obsidian plugin contract tests
        run: node --test tests/plugin.test.cjs
      - name: Syntax check
        run: python -m compileall -q scripts
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: CLI smoke test
        shell: bash
        run: |
          python scripts/media_library.py import --vault ./test-vault --input examples/sample.csv
          python scripts/media_library.py validate --vault ./test-vault
